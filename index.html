<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows-mqtt</title>
    <script>
      const lines = [];

      function renderLogs() {
        const logTextarea = document.getElementById('log');
        logTextarea.value = lines.join('\n');
        logTextarea.scrollTop = logTextarea.scrollHeight;
      }

      function appendLog(message) {
        lines.push(message);
        if (lines.length > 500) lines.splice(0, lines.length - 500);
        renderLogs();
      }

      function renderEnabledModules(enabledModules) {
        const modulesList = document.getElementById('enabled-modules');
        modulesList.innerHTML = enabledModules.map(mod => `<span class="module">${mod}</span>`).join(', ');
      }

      async function start() {
        if (!window.__TAURI__) {
          appendLog('No backend detected.');
          return;
        }
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;

        // Subscribe to logs BEFORE starting the server so early lines are kept.
        await listen('server-log', (event) => {
          const payload = event.payload || {};
          const prefix = payload.level ? `[${payload.level}] ` : '';
          appendLog(`${prefix}${payload.message || ''}`.trim());
        });

        // Заголовок окна ставит Rust (`setup`), но document.title на некоторых
        // платформах перебивает его — держим здесь ту же строку с версией.
        const version = await invoke('get_app_version');
        document.title = `windows-mqtt v${version}`;

        await invoke('start_mqtt_server');
        const enabledModules = await invoke('get_enabled_modules');
        renderEnabledModules(enabledModules);
      }

      window.addEventListener('DOMContentLoaded', () => {
        start().catch((e) => appendLog(`Error: ${e}`));
      });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #body {
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: 5px 0;
        }

        #log {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            width: 100%;
            height: 400px;
            resize: vertical;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="body">
    <div>
        <b>Enabled Modules:</b>
        <span id="enabled-modules"></span>
    </div>
    <textarea id="log" readonly></textarea>
</div>
</body>
</html>

debug: true
#logLevel: 'info'
logLevel: debug
log:
  path: 'data/windows-mqtt.log'
  # enabled: false   # set to disable on-disk logging (console output stays)
# Periodic process-health sampling (memory, CPU, event-loop utilization, handle
# counts). Appends JSONL to <settings-dir>/windows-mqtt/sysstats.jsonl (rotated
# at 10 MB) and publishes JSON to <mqtt.base>/sysstats. Enabled by default.
monitor:
  # enabled: false   # disable sampling entirely
  interval: 60       # sampling period in seconds (default 60)
  # topic: 'home/room/pc/sysstats'   # override the publish topic
  # path: 'data/sysstats.jsonl'      # override the on-disk stats file
mqtt:
  host: 'mqtt.example.com'
  port: 1883
  user: 'your_username'
  password: 'your_password'
  base: 'home/room/pc'

# Export state to Home Assistant over its REST API. Entities pushed this way
# live until Home Assistant restarts and come back with the next export, so the
# exporter runs on a timer rather than once at startup.
homeassistant:
  enabled: false
  url: 'http://homeassistant.local:8123'
  # Long-lived access token: Home Assistant profile page, bottom of the list.
  token: ''
  timeoutMs: 5000

picker:
  # Global hotkey for the claude session picker. Windows swallows some Win+
  # combinations before they reach the app; change this if it never fires.
  hotkey: 'Super+F10'

# Project hotkeys + WT profiles: claudeWt.projects in windows11-manager.config.js

tray:
  # What a left click on the tray icon opens: picker | log
  leftClick: log

modules:
  audio:
    interval: 5   # loudness fallback polling period (seconds), used only when
                  # the audio-watcher sidecar binary is missing
    volume:
      set: '/volume/set'
      stat: '/volume'
    mute:
      set: '/mute/set'
      stat: '/mute'
    # Default playback/recording device reporting, event-driven via the native
    # audio-watcher sidecar (no PowerShell). Build it with
    # `npm run build-audio-watcher`. Set `device: false` to disable.
    device:
      stat: '/device'                 # recording device topic
      playbackStat: '/device/playback' # playback device topic
      # restartSec: 5                  # respawn delay if the sidecar dies
      # Optional exact-name relabels (device friendly name -> published value):
      # aliases:
      #   'Наушники': 'Наушники'
  clipboard:
    screenshotPath: 'data/screenshot.png'
    imageSearchPath: 'data/images/search'
  commands:
    # default_payload: '1',
    # config_path: '../commands.yml',
    shells:
      bash: '"c:/Program Files/Git/bin/bash.exe"'
    custom_commands_path: 'data/commands_custom.yml'
    cache_path: 'data/windows-mqtt-commands.yml'
  dirwatch:
    dirs:
      - path: 'D:/video/_obs/*.mp4'
        name: 'OBS'
      - path: 'C:/Users/username/Downloads'
        name: 'Downl'
      # - path: 'M:/video'
      #   name: 'Torrent'
      # - path: 'D:/rec/2025/*.mp3'
      #   name: 'Песни'
      # - path: 'D:/audiobooks'
      #   name: 'Книги'
  exec:
    success_tts: 'Готово' # 'stdout' for answer with command output
    error_tts: 'Ошибка выполнения команды'
    long_time_sec: 5
    ssh_app: 'wt.exe -p your_profile ssh -A'
  filewatch:
    files: []
      # - path: 'C:/path/to/config/openhasp.yaml'
      #   mqtt_topic: 'openhasp'
      #   mqtt_payload: 'openhasp.yaml'
      # - path: 'C:/path/to/config/openhasp_lines.yaml'
      #   mqtt_topic: 'openhasp'
      #   mqtt_payload: 'openhasp_lines.yaml'
      # - path: 'C:/path/to/config/openhasp_buttons.yaml'
      #   mqtt_topic: 'openhasp/update/buttons'
      #   mqtt_payload: 'openhasp_buttons.yaml'
  gpt:
    enabled: false
    openai_api_key: 'your_openai_api_key_here'
    completion_params:
      temperature: 1
    timeoutMs: 30000
    systemMessage: 'Напиши ответ на сообщение.\n\nТекст сообщения:\n\n'
    debug: true
    logPath: 'data/stt.log'
  keys: {}
  midi:
    devices:
      - portName: 'USB-Midi'
        vid: '17235'
        pid: '19277'
        hotReload: true
        hotkeys:
          # next right: 7350,620
          # replay left: 5000,820

          # play
          - midi: [144, 94, '>0']
            mqtt: ['home/room/pc/keys/press', 'space']
          # prev
          - midi: [144, 91, '>0']
            mqtt: ['home/room/pc/keys/press', 'up']
          # next
          - midi: [144, 92, '>0']
            mqtt: ['home/room/pc/keys/press', 'down']
          # pause (replay)
          - midi: [144, 93, '>0']
            mqtt: ['home/room/pc/mouse/point', '5750,350,left']
          # next right
          - midi: [144, 47, '>0']
            mqtt: ['home/room/pc/mouse/point', '6500,350,left']
          # exit lesson
          - midi: [144, 96, '>0']
            mqtt: ['home/room/pc/mouse/point', '6700,350,left']
      - portName: 'SMK25Mini'
        vid: '17235'
        pid: '19277'
        hotReload: true
        hotkeys:
          # крутилка - запоминает цифру
          - midi: [176, 7]
            type: 'range'
            to_max: 127
            fastDebounce: true
            mqtt: ['home/room/pc/set-num', '{{payload}}']
          # разместить окна
          - midi: [144, 48, '>0']
            mqtt: ['home/room/pc/windows/autoplace', '1']
          # свет комнаты
          - midi: [144, 49, '>0']
            mqtt: ['home/room/switch', '1']
          # помидор
          - midi: [144, 51, '>0']
            mqtt: ['actions/pomodoro', '1']
          # яркость света
          - midi: [144, 53, '>0']
            mqtt: ['state/light/set', 'moonlight']
          - midi: [144, 54, '>0']
            mqtt: ['state/light/set', 'night']
          - midi: [144, 56, '>0']
            mqtt: ['state/light/set', 'day']
          - midi: [144, 58, '>0']
            mqtt: ['state/light/set', 'max']
          # самая правая клавиша - мьют
          - midi: [144, 72, '>0']
            mqtt: ['actions/mute', '1']
  mouse: {}
  notify:
    title: 'Дом'
    appIcons:
      'Сообщения': 'sms.png'
      'Messages': 'sms.png'
      'СберБанк': 'sber.png'
      'Заметки Google Keep': 'keep.png'
      'Тинькофф': 'tinkoff.png'
      'Tinkoff': 'tinkoff.png'
      'Planfix': 'planfix.png'
      'Castbox': 'castbox.png'
      'ГдеПосылка': 'gdeposylka.png'
      'PackageRadar': 'gdeposylka.png'
      'POLARIS': 'polaris.png'
      'Gmail': 'gmail.png'
    appSounds: {}
      # 'Сообщения': false, # работает
      # 'СберБанк': 'Blow', # не работает
      # 'Заметки Google Keep': 'Bottle'
      # 'Тинькофф': 'Frog'
    # clearNotificationWebhook: 'https://trigger.macrodroid.com/your-webhook-id/notification-clear'
    clearNotificationWebhook: 'https://example.com/webhook/notification-clear'
    markAsReadText: 'Прочитано'
  obs:
    enabled: false
    # base: 'home/room/pc/obs'
    # host: 'localhost'
    # port: 4455
    password: 'your_obs_password'
  reaper: {}
    # base: 'home/room/pc/reaper'
    # host: 'localhost'
    # port: 8080
    # password: 'your_reaper_password'
  tabs:
    port: 5555
    base: 'state/pc/tabs'
    excludedDomains:
      - 'web.whatsapp.com'
  tts:
    enabled: false
    ttsTopic: 'tts'
    playCommand: 'mpg123 -q' # linux: mpg321 -q
    lang: 'ru'
    gapLinux: 200
    gapNoLinux: 0
  vad:
    enabled: false
    # download model to data/silero_vad.onnx - https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
    # threshold: 0.5
    # minSpeechDuration: 0.25
    # minSilenceDuration: 0.5
    # windowSize: 512
    # sampleRate: 16000
    # numThreads: 1
  windows:
    # enabled: false
    placeWindowOnOpen: true
    # start the claude-wt window position watcher (needs a claudeWt block with
    # statePath in %APPDATA%\windows-mqtt\windows11-manager.config.js)
    claudeWt: false
    # Пикер сессий: cost | oldest | newest | recent | name. Меняется кликом по
    # statusline внизу списка и пишется сюда же без перезаписи всего файла.
    sessionsSort: cost
    # Чекбоксы в statusline пикера. Каждый переключается кликом и пишется сюда
    # же; подписи в списке — paths, events, id, cost, context.
    # Строка cwd под именем сессии.
    showPaths: true
    # Текст agent state/event (idle, attention, …).
    showEvent: true
    # Короткий id сессии — то же, чем её называет claude --resume.
    showId: false
    # Потрачено за сессию, $.
    showCost: true
    # Заполненность контекста, % (жёлтый с 30, красный с 40).
    showContext: true
    # Ctrl+K в пикере: открыть cwd сессии в Cursor / Explorer / ssh-терминале.
    # Linux cwd (/home/popstas/...) мапится на SMB-диск V:. ssh_app берётся из
    # modules.exec, если здесь не задан.
    # sessionOpen:
    #   linuxHome: '/home/popstas'
    #   windowsRoot: 'V:\\'
    #   sshHost: 'popstas@pc-virt.popstas.pro'
    #   sshApp: 'wt.exe -p your_profile ssh -A'
    # Сколько строк отдавать в Home Assistant и как часто. Строк постоянное
    # число: кнопка на панели прибита к строке, а не к сессии. Интервал редкий —
    # опрос окон недёшев, а панель не требует секундной точности.
    homeassistant:
      slots: 9
      interval: 15
      # Только живые сессии. Строк на панели единицы, и каждая, занятая давно
      # закрытой сессией, вытесняет работающую. Закрытые остаются в пикере —
      # там места хватает, и восстановить их можно только оттуда.
      openOnly: true
      # Порядок слотов на панели. По умолчанию = sessionsSort пикера.
      # sessionsSort: cost
    placeWindowOnStart: false
    notifyPlaced: true
    restoreOnStart: true
    publishStats: true
    publishStatsTopic: 'state/pc/windows'
    store:
      default:
        apps:
          # - "C:\\Program Files\\Microsoft VS Code\\Code.exe"
          - "C:\\Program Files\\Mozilla Thunderbird\\thunderbird.exe"
          - "C:\\Users\\username\\AppData\\Local\\Yandex\\YandexBrowser\\Application\\browser.exe"
          - "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
          # - "C:\\Program Files\\WindowsApps\\...\\WhatsApp.exe"
          - "C:\\Users\\username\\AppData\\Roaming\\Telegram Desktop\\Telegram.exe"
        paths: []
      custom:
        apps: []
          # "C:\\Users\\username\\AppData\\Local\\Yandex\\YandexBrowser\\Application\\browser_proxy.exe --profile-directory=Default --app-id=..."
        paths: []





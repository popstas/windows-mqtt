[package]
name = "audio-watcher"
version = "0.0.1"
authors = ["Stanislav Popov"]
edition = "2021"
description = "Prints the Windows default playback/recording device on change (Core Audio IMMNotificationClient)"

[[bin]]
name = "audio-watcher"
path = "src/main.rs"

[dependencies]
# The `#[implement]` macro expands to `windows_core::...` paths, so the crate
# must be nameable directly (the umbrella re-export isn't enough).
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

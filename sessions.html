<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>claude sessions</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; overflow: hidden; position: relative;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1e1f22; color: #e6e6e6;
            border: 1px solid #3a3d42; border-radius: 10px;
            display: flex; flex-direction: column;
        }
        #search {
            width: 100%; padding: 16px 18px; font-size: 18px;
            background: transparent; color: inherit;
            border: none; border-bottom: 1px solid #3a3d42; outline: none;
            flex: 0 0 auto;
        }
        #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 0; }
        #statusline {
            height: 28px; padding: 0 18px; display: flex; align-items: center; gap: 14px;
            font-size: 11px; color: #7d838c; border-top: 1px solid #3a3d42;
            user-select: none; flex: 0 0 28px;
        }
        #sort-control {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }
        #sort-control:hover { color: #a8adb5; }
        #statusline .icon { font-size: 12px; line-height: 1; }
        .status-checks {
            display: flex; align-items: center; gap: 12px; margin-left: auto;
        }
        .status-check {
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; color: #7d838c;
        }
        .status-check:hover { color: #a8adb5; }
        .status-check input {
            margin: 0; accent-color: #7d838c; cursor: pointer;
        }
        .group-label {
            padding: 8px 18px 4px; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #7d838c;
        }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 7px 18px; cursor: pointer;
        }
        .row.active { background: #31343a; }
        .row.active .cwd { color: #9aa0a8; }
        .dot {
            flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
            background: #6e7681;
        }
        /* Агент работает. */
        .dot.active { background: #3fb950; }
        /* Агент спрашивает — ждёт ответа человека. */
        .dot.question { background: #d29922; }
        /* Агент закончил, результат ещё не смотрели. */
        .dot.review { background: #db6d28; }
        /* Простаивает: закончил и постоял, считается проверенным. */
        .dot.idle { background: #6e7681; }
        /* Закрытая сессия — кружка нет, но место под него остаётся,
           иначе текст закрытых строк съезжает относительно живых. */
        .dot.closed { background: transparent; }
        .row.closed .name { color: #a8adb5; }
        .text { min-width: 0; }
        .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cwd { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .snap-meta { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .snap-restore { font-size: 11px; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Чем сессия закончила / что спросили. Тусклее пути: это подсказка, а
           не опознание — строку ищут глазами по названию и каталогу. */
        .summary { font-size: 11px; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prompt { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .name .hotkey { margin-left: 6px; font-size: 11px; color: #7d838c; font-weight: normal; }
        /* Текстовый статус агента, прижат вправо вместе с возрастом. */
        .state {
            flex: 0 0 auto; margin-left: auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Контекст и деньги, между статусом и возрастом. */
        .usage {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Заполненность контекста. Жёлтый — тот же, что у спрашивающего агента:
           «обрати внимание». Красный — «скоро начнёт забывать начало». */
        .usage .ctx.warn { color: #d29922; }
        .usage .ctx.hot { color: #f85149; }
        .usage .cost { color: #6f757e; }
        /* Возраст последней активности, крайняя правая колонка. */
        .age {
            flex: 0 0 auto; padding-left: 10px; min-width: 34px; text-align: right;
            font-size: 11px; color: #7d838c; font-variant-numeric: tabular-nums;
        }
        #message { padding: 24px 18px; color: #868c95; font-size: 13px; flex: 0 0 auto; }
        /* Ctrl+K actions overlay — sits above the session list, same palette. */
        #actions-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #actions-backdrop.open { display: flex; }
        #actions-menu {
            width: min(360px, 100%); background: #25262a;
            border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45); overflow: hidden;
        }
        #actions-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        #actions-list { padding: 6px 0; }
        .action-row {
            padding: 10px 16px; font-size: 13px; cursor: pointer;
        }
        .action-row.active { background: #31343a; }
        #actions-empty {
            display: none; padding: 16px; font-size: 13px; color: #868c95;
        }
    </style>
</head>
<body>
<input id="search" type="text" placeholder="Search claude sessions…" autocomplete="off" spellcheck="false">
<div id="list"></div>
<div id="message">Loading…</div>
<div id="statusline">
  <span id="sort-control" title="Click to change sort"><span class="icon">⇅</span><span id="sort-label">cost</span></span>
  <span class="status-checks">
    <label class="status-check"><input type="checkbox" id="show-paths" checked> Show paths</label>
    <label class="status-check"><input type="checkbox" id="show-event" checked> Show event</label>
  </span>
</div>
<div id="actions-backdrop" aria-hidden="true">
  <div id="actions-menu" role="menu">
    <div id="actions-title"></div>
    <div id="actions-list"></div>
    <div id="actions-empty">No open actions for this session.</div>
  </div>
</div>
<script src="picker-filter.js"></script>
<script src="picker-snapshots.js"></script>
<script src="session-glyph.js"></script>
<script>
  let groups = [];
  let rows = [];
  let snapshotRows = [];
  let snapshotsLoading = false;
  let active = 0;
  let sortMode = 'cost';
  let showPaths = true;
  let showEvent = true;
  let menuOpen = false;
  let menuActions = [];
  let menuActive = 0;
  let menuSessionId = null;

  const search = document.getElementById('search');
  const list = document.getElementById('list');
  const message = document.getElementById('message');
  const statusline = document.getElementById('statusline');
  const sortControl = document.getElementById('sort-control');
  const sortLabel = document.getElementById('sort-label');
  const showPathsCheckbox = document.getElementById('show-paths');
  const showEventCheckbox = document.getElementById('show-event');
  const actionsBackdrop = document.getElementById('actions-backdrop');
  const actionsTitle = document.getElementById('actions-title');
  const actionsList = document.getElementById('actions-list');
  const actionsEmpty = document.getElementById('actions-empty');

  function paintSort() {
    sortLabel.textContent = sortMode;
  }

  function paintShowPaths() {
    showPathsCheckbox.checked = showPaths;
  }

  function paintShowEvent() {
    showEventCheckbox.checked = showEvent;
  }

  function invoke(cmd, args) {
    if (!window.__TAURI__) return Promise.resolve();
    return window.__TAURI__.core.invoke(cmd, args);
  }

  const {
    statusDotHtml, ageHtml, stateHtml, usageHtml, shortPath, titleAttr, escapeHtml,
  } = window.SessionGlyph;

  function render() {
    const nowSec = Math.floor(Date.now() / 1000);
    rows = [];
    let html = '';

    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) {
      for (const snap of snapshotRows) {
        const index = rows.length;
        rows.push(snap);
        html += `<div class="row" data-index="${index}">` +
          `<div class="text">` +
          `<div class="name">${escapeHtml(snap.line1)}</div>` +
          `<div class="snap-meta">${escapeHtml(snap.line2)}</div>` +
          `<div class="snap-restore">${escapeHtml(snap.line3)}</div>` +
          `</div></div>`;
      }
      list.innerHTML = html;
      if (!rows.length) {
        message.style.display = 'block';
        message.textContent = snapshotsLoading ? 'Loading snapshots…' : 'No snapshots yet.';
      } else {
        message.style.display = 'none';
      }
      if (active >= rows.length) active = Math.max(0, rows.length - 1);
      paint();
      return;
    }

    const visible = window.PickerFilter.filterSessions(groups, search.value);
    // Одна отметка времени на всю отрисовку: иначе строки одного и того же
    // списка считали бы возраст от чуть разных «сейчас».
    for (const group of visible) {
      html += `<div class="group-label">${escapeHtml(group.label)}</div>`;
      for (const session of group.sessions) {
        const index = rows.length;
        rows.push(session);
        html += `<div class="row ${session.open ? '' : 'closed'}" data-index="${index}"${titleAttr(session)}>` +
          statusDotHtml(session) +
          `<div class="text"><div class="name">${escapeHtml(session.label)}` +
          `${session.hotkey ? `<span class="hotkey">${escapeHtml(session.hotkey)}</span>` : ''}` +
          `</div>` +
          (showPaths
            ? `<div class="cwd">${escapeHtml(shortPath(session.cwd))}</div>` : '') +
          // Две строки под карточкой: что спросили и чем ответили. Пустой div
          // всё равно занял бы высоту, поэтому рисуем только то, что есть.
          // Склейку «сводка, а у работающей — последняя» считает windows11-manager
          // (`agentDescription`): та же строка уходит в Home Assistant и на плату.
          (session.agentPrompt
            ? `<div class="prompt">${escapeHtml(session.agentPrompt)}</div>` : '') +
          (session.agentDescription
            ? `<div class="summary">${escapeHtml(session.agentDescription)}</div>` : '') +
          `</div>` +
          stateHtml(session, showEvent) + usageHtml(session) + ageHtml(session, nowSec) + `</div>`;
      }
    }
    list.innerHTML = html;
    message.style.display = rows.length ? 'none' : 'block';
    if (!rows.length) message.textContent = groups.length ? 'Nothing matches.' : 'No claude sessions yet.';
    if (active >= rows.length) active = Math.max(0, rows.length - 1);
    paint();
  }

  function paint() {
    const nodes = list.querySelectorAll('.row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === active));
  }

  function move(delta) {
    if (!rows.length) return;
    active = (active + delta + rows.length) % rows.length;
    paint();
    // Только здесь, не в paint: render() тикает раз в секунду с обновлением
    // списка, и scrollIntoView каждый раз дёргал бы скролл к активной строке,
    // даже когда пользователь сам ушёл вниз читать другие сессии.
    const current = list.querySelectorAll('.row')[active];
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  async function choose() {
    const row = rows[active];
    if (!row) return;
    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) {
      await invoke('hide_picker');
      await invoke('picker_send', {
        action: 'windows/claude-snapshot-restore',
        payload: { id: row.id },
      });
      return;
    }
    await invoke('hide_picker');
    // Always go through claude-focus rather than picking the action here from
    // this ~1s-stale snapshot. claudeFocus() re-fetches live session state and
    // runs it through chooseAction() (src/picker/session-groups.js), which is
    // the single place that decides focus-vs-restore against the current
    // handle. Deciding it here too would leave two decision points that must
    // agree — and this one, working off a stale snapshot, previously routed a
    // session that had actually opened since the last snapshot into
    // claude-restore-one, which correctly refused to double-spawn it but then
    // reported a bogus "failed to restore" instead of focusing the live window.
    await invoke('picker_send', {
      action: 'windows/claude-focus',
      payload: { id: row.id },
    });
  }

  function requestSnapshots() {
    snapshotsLoading = true;
    snapshotRows = [];
    render();
    invoke('picker_send', { action: 'windows/claude-snapshots' });
  }

  function onSearchInput() {
    active = 0;
    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) {
      requestSnapshots();
      return;
    }
    snapshotRows = [];
    snapshotsLoading = false;
    render();
  }

  function closeMenu() {
    menuOpen = false;
    menuActions = [];
    menuActive = 0;
    menuSessionId = null;
    actionsBackdrop.classList.remove('open');
    actionsBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  function paintMenu() {
    const nodes = actionsList.querySelectorAll('.action-row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === menuActive));
  }

  function renderMenu(data) {
    menuSessionId = data.id;
    menuActions = data.actions || [];
    menuActive = 0;
    const title = data.label
      ? `${data.label} — ${shortPath(data.cwd || '')}`
      : shortPath(data.cwd || '') || 'Session';
    actionsTitle.textContent = title;
    if (!menuActions.length) {
      actionsList.innerHTML = '';
      actionsEmpty.style.display = 'block';
    } else {
      actionsEmpty.style.display = 'none';
      actionsList.innerHTML = menuActions.map((action, index) =>
        `<div class="action-row${index === 0 ? ' active' : ''}" data-index="${index}" role="menuitem">${escapeHtml(action.label)}</div>`
      ).join('');
    }
    menuOpen = true;
    actionsBackdrop.classList.add('open');
    actionsBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  function openMenu() {
    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
    const session = rows[active];
    if (!session) return;
    menuSessionId = session.id;
    invoke('picker_send', {
      action: 'windows/claude-session-actions',
      payload: { id: session.id },
    });
  }

  async function runMenuAction() {
    const action = menuActions[menuActive];
    if (!action || !menuSessionId) return;
    const id = menuSessionId;
    const actionId = action.id;
    closeMenu();
    // Пометка непрочитанным — единственное действие, после которого смотреть
    // надо на этот же список: кружок перекрашивается в ближайшую секунду, и
    // сессий за раз помечают несколько.
    if (actionId === 'unread') {
      await invoke('picker_send', {
        action: 'windows/claude-session-unread',
        payload: { id },
      });
      return;
    }
    await invoke('hide_picker');
    await invoke('picker_send', {
      action: 'windows/claude-session-open',
      payload: { id, action: actionId },
    });
  }

  function moveMenu(delta) {
    if (!menuActions.length) return;
    menuActive = (menuActive + delta + menuActions.length) % menuActions.length;
    paintMenu();
  }

  search.addEventListener('input', onSearchInput);

  document.addEventListener('keydown', (e) => {
    if (menuOpen) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveMenu(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveMenu(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runMenuAction(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      openMenu();
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(); }
    else if (e.key === 'Escape') { e.preventDefault(); invoke('hide_picker'); }
  });

  list.addEventListener('click', (e) => {
    if (menuOpen) return;
    const row = e.target.closest('.row');
    if (!row) return;
    active = Number(row.dataset.index);
    // Shift+клик помечает непрочитанным вместо открытия. Промах по Shift не
    // должен превращаться в открытие сессии, поэтому строка без записи агента
    // (снимки, сессия без хука) просто ничего не делает.
    if (e.shiftKey) {
      if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      const session = rows[active];
      if (!session || !session.agentState) return;
      invoke('picker_send', {
        action: 'windows/claude-session-unread',
        payload: { id: session.id },
      });
      return;
    }
    choose();
  });

  actionsList.addEventListener('click', (e) => {
    const row = e.target.closest('.action-row');
    if (!row) return;
    menuActive = Number(row.dataset.index);
    runMenuAction();
  });

  actionsBackdrop.addEventListener('click', (e) => {
    if (e.target === actionsBackdrop) closeMenu();
  });

  sortControl.addEventListener('click', (e) => {
    e.preventDefault();
    if (menuOpen) return;
    invoke('picker_send', { action: 'windows/claude-sessions-sort-cycle' });
  });

  showPathsCheckbox.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  showPathsCheckbox.addEventListener('change', () => {
    showPaths = showPathsCheckbox.checked;
    render();
    invoke('picker_send', {
      action: 'windows/claude-sessions-show-paths',
      payload: { showPaths },
    });
  });

  showEventCheckbox.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  showEventCheckbox.addEventListener('change', () => {
    showEvent = showEventCheckbox.checked;
    render();
    invoke('picker_send', {
      action: 'windows/claude-sessions-show-event',
      payload: { showEvent },
    });
  });

  // Reset the palette for a show and (re)start the feed. Called both from the
  // 'picker-shown' listener (every show after the window has finished
  // loading) and, once, directly from start() to cover the show that raced
  // ahead of this webview finishing DOMContentLoaded (see start()).
  function beginShow() {
    closeMenu();
    search.value = '';
    active = 0;
    snapshotRows = [];
    snapshotsLoading = false;
    search.focus();
    search.select();
    // Clear the previous show's session list before anything else. Without
    // this, two things go wrong: the '!groups.length' watchdog guard below
    // stays permanently false once any show ever received data (so it can
    // never fire again), and the palette renders seconds-old rows the user
    // could click before the fresh 'claude-wt-sessions' event arrives.
    groups = [];
    render();
    // Reset the watchdog's target state on every show, not just once at page
    // load: a stale 'Backend not responding.' from a previous show must not
    // linger into the next one, and a fresh 2s window is what actually
    // reflects "the backend hasn't answered since the picker last opened".
    message.textContent = 'Loading…';
    invoke('picker_send', { action: 'windows/claude-sessions-start' });
    setTimeout(() => {
      if (!groups.length && message.textContent === 'Loading…') {
        message.textContent = 'Backend not responding.';
      }
    }, 2000);
  }

  async function start() {
    if (!window.__TAURI__) { message.textContent = 'No backend detected.'; return; }
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    await listen('claude-wt-sessions', (event) => {
      const data = event.payload || {};
      if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      if (!data.ok) {
        groups = [];
        render();
        message.style.display = 'block';
        message.textContent = data.reason || 'claude-wt is not available.';
        return;
      }
      groups = data.groups || [];
      if (data.sort) sortMode = data.sort;
      if (typeof data.showPaths === 'boolean') showPaths = data.showPaths;
      if (typeof data.showEvent === 'boolean') showEvent = data.showEvent;
      paintSort();
      paintShowPaths();
      paintShowEvent();
      render();
    });

    await listen('claude-wt-snapshots', (event) => {
      const data = event.payload || {};
      snapshotsLoading = false;
      if (!window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      if (!data.ok) {
        snapshotRows = [];
        render();
        message.style.display = 'block';
        message.textContent = data.reason || 'claude-wt snapshots failed.';
        return;
      }
      snapshotRows = window.PickerSnapshots.buildSnapshotRows(
        data.snapshots || [],
        new Set(data.openSessionIds || []),
      );
      render();
    });

    await listen('claude-wt-session-actions', (event) => {
      const data = event.payload || {};
      if (!data.ok) {
        if (menuSessionId) {
          renderMenu({ id: menuSessionId, label: '', cwd: '', actions: [] });
        }
        return;
      }
      if (menuSessionId && data.id !== menuSessionId) return;
      renderMenu(data);
    });

    // Fired by Rust every time the window is shown.
    await listen('picker-shown', beginShow);

    await listen('picker-hidden', () => {
      closeMenu();
      invoke('picker_send', { action: 'windows/claude-sessions-stop' });
    });

    search.focus();

    // The hotkey is live from Rust's setup(), before this webview has
    // necessarily finished loading — a press in that window shows the
    // picker without a 'picker-shown' event ever reaching a listener that
    // didn't exist yet. Cover that first-show race by checking whether the
    // window is already visible right now; if so, this is that race and the
    // feed needs to be started here instead of waiting for an event that
    // already fired.
    const alreadyVisible = await getCurrentWindow().isVisible().catch(() => false);
    if (alreadyVisible) {
      beginShow();
    }
  }

  window.addEventListener('DOMContentLoaded', () => { start(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>claude sessions</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; overflow: hidden; position: relative;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1e1f22; color: #e6e6e6;
            border: 1px solid #3a3d42; border-radius: 10px;
            display: flex; flex-direction: column;
        }
        #search {
            width: 100%; padding: 16px 18px; font-size: 18px;
            background: transparent; color: inherit;
            border: none; border-bottom: 1px solid #3a3d42; outline: none;
            flex: 0 0 auto;
        }
        #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 0; }
        #statusline {
            height: 28px; padding: 0 18px; display: flex; align-items: center; gap: 14px;
            font-size: 11px; color: #7d838c; border-top: 1px solid #3a3d42;
            user-select: none; flex: 0 0 28px;
        }
        #sort-control {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }
        #sort-control:hover { color: #a8adb5; }
        #statusline .icon { font-size: 12px; line-height: 1; }
        /* Подсказка про Ctrl+K, между переключателем сортировки и чекбоксами.
           min-width: 0 + ellipsis — тем же приёмом, что .text у строки списка:
           при узком окне подсказка обрезается первой, а не толкает
           status-checks (у него margin-left: auto) или не ломает раскладку. */
        #menu-hint {
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .status-checks {
            display: flex; align-items: center; gap: 12px; margin-left: auto;
        }
        .status-check {
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; color: #7d838c;
        }
        .status-check:hover { color: #a8adb5; }
        /* Левая половина чекбоксов (то, что рисуется под именем сессии) отбита
           от правой (колонки справа) — к обычным 12px ещё столько же. */
        .status-check.gap { margin-left: 12px; }
        .status-check input {
            margin: 0; accent-color: #7d838c; cursor: pointer;
        }
        .group-label {
            padding: 8px 18px 4px; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #7d838c;
        }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 7px 18px; cursor: pointer;
        }
        .row.active { background: #31343a; }
        .row.active .cwd { color: #9aa0a8; }
        .dot {
            flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
            background: #6e7681;
        }
        /* Агент работает. */
        .dot.active { background: #3fb950; }
        /* Агент спрашивает — ждёт ответа человека. */
        .dot.question { background: #d29922; }
        /* Агент закончил, результат ещё не смотрели. */
        .dot.review { background: #db6d28; }
        /* Простаивает: закончил и постоял, считается проверенным. */
        .dot.idle { background: #6e7681; }
        /* Закрытая сессия — кружка нет, но место под него остаётся,
           иначе текст закрытых строк съезжает относительно живых. */
        .dot.closed { background: transparent; }
        /* Пока держат Shift, строка под курсором показывает, что с ней сделает
           клик: кружок становится пустой оранжевой рамкой — тем же оранжевым,
           каким горит непросмотренная сессия. Только у строк, которые есть чем
           пометить: обещать пометку там, где Shift+клик ничего не делает,
           хуже, чем не обещать ничего. */
        body.shift .row.markable:hover .dot {
            background: transparent;
            box-shadow: inset 0 0 0 2px #db6d28;
        }
        .row.closed .name { color: #a8adb5; }
        .text { min-width: 0; }
        .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cwd { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .snap-meta { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .snap-restore { font-size: 11px; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Чем сессия закончила / что спросили. Тусклее пути: это подсказка, а
           не опознание — строку ищут глазами по названию и каталогу. */
        .summary { font-size: 11px; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prompt { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Метка PR — той же тусклостью, что и колонка хоткея: опознают строку
           по имени и пути, это подсказка рядом. */
        .name .pr { margin-left: 6px; font-size: 11px; color: #7d838c; font-weight: normal; }
        /* Правые колонки одной группой: статус, id, контекст с деньгами,
           возраст. Прижимает их сюда именно она — раньше это делала `.state`
           своим margin-left: auto, и выключенный чекбокс события уносил
           остальные колонки к названию сессии. Теперь любая колонка может
           пропасть, а группа останется справа. */
        .meta {
            flex: 0 0 auto; margin-left: auto;
            display: flex; align-items: center; gap: 12px;
        }
        /* Текстовый статус агента. */
        .state {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Короткий id сессии — тем же, чем `claude --resume` и имя транскрипта.
           Моноширинные цифры, как у контекста и возраста: колонка из четырёх
           знаков не должна дышать от строки к строке. */
        .sid {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Хоткей проекта (`^F12`). Раньше стоял подписью внутри имени сессии,
           теперь колонка — см. hotkeyHtml в session-glyph.js. */
        .hk {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Контекст и деньги, между статусом и возрастом. */
        .usage {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Заполненность контекста. Жёлтый — тот же, что у спрашивающего агента:
           «обрати внимание». Красный — «скоро начнёт забывать начало». */
        .usage .ctx.warn { color: #d29922; }
        .usage .ctx.hot { color: #f85149; }
        .usage .cost { color: #6f757e; }
        /* Возраст последней активности, крайняя правая колонка. */
        .age {
            flex: 0 0 auto; padding-left: 10px; min-width: 34px; text-align: right;
            font-size: 11px; color: #7d838c; font-variant-numeric: tabular-nums;
        }
        #message { padding: 24px 18px; color: #868c95; font-size: 13px; flex: 0 0 auto; }
        /* Ctrl+K actions overlay — sits above the session list, same palette. */
        #actions-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #actions-backdrop.open { display: flex; }
        #actions-menu {
            width: min(360px, 100%); background: #25262a;
            border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45); overflow: hidden;
        }
        #actions-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        #actions-list { padding: 6px 0; }
        /* flex, а не блок: подпись клавиши прижимается вправо тем же приёмом,
           что и колонка статуса в строке списка (margin-left: auto), а не
           текстом внутри одной строки — иначе делить их пришлось бы вручную. */
        .action-row {
            display: flex; align-items: center;
            padding: 10px 16px; font-size: 13px; cursor: pointer;
        }
        .action-row.active { background: #31343a; }
        .action-label {
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        /* Прямая клавиша действия, тусклым — тем же цветом, что и колонка .hk. */
        .action-hotkey {
            flex: 0 0 auto; margin-left: auto; padding-left: 12px;
            font-size: 11px; color: #7d838c;
        }
        #actions-empty {
            display: none; padding: 16px; font-size: 13px; color: #868c95;
        }
        /* Session info — тот же модал, что и меню действий: разные только
           содержимое и ширина. */
        #info-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #info-backdrop.open { display: flex; }
        #info-card {
            width: min(560px, 100%); max-height: 100%; overflow-y: auto;
            background: #25262a; border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
        }
        #info-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        #info-rows { padding: 8px 0; }
        .info-row { display: flex; gap: 12px; padding: 3px 16px; font-size: 12px; }
        .info-row .k { flex: 0 0 96px; color: #7d838c; }
        .info-row .v { min-width: 0; word-break: break-word; }
    </style>
</head>
<body>
<input id="search" type="text" placeholder="Search claude sessions…" autocomplete="off" spellcheck="false">
<div id="list"></div>
<div id="message">Loading…</div>
<div id="statusline">
  <span id="sort-control" title="Click to change sort"><span class="icon">⇅</span><span id="sort-label">cost</span></span>
  <span id="menu-hint">^K - Session menu</span>
  <!-- Наполняется из TOGGLE_CHECKS: разметка и обработчики не должны
       расходиться в именах ключей. -->
  <span class="status-checks" id="status-checks"></span>
</div>
<div id="actions-backdrop" aria-hidden="true">
  <div id="actions-menu" role="menu">
    <div id="actions-title"></div>
    <div id="actions-list"></div>
    <div id="actions-empty">No open actions for this session.</div>
  </div>
</div>
<div id="info-backdrop" aria-hidden="true">
  <div id="info-card" role="dialog">
    <div id="info-title"></div>
    <div id="info-rows"></div>
  </div>
</div>
<script src="picker-filter.js"></script>
<script src="picker-list-sync.js"></script>
<script src="picker-snapshots.js"></script>
<script src="session-glyph.js"></script>
<script src="session-info.js"></script>
<script>
  let groups = [];
  let rows = [];
  let snapshotRows = [];
  let snapshotsLoading = false;
  let active = 0;
  let sortMode = 'cost';
  // Чекбоксы statusline. Ключи и умолчания те же, что в PICKER_TOGGLES
  // (src/picker/sessions-sort-config.js): оттуда они приезжают с каждым
  // списком, туда же уходят при клике и там же сохраняются в config.yml.
  // Порядок и группы — как в самой строке списка: сначала то, что рисуется
  // слева под именем сессии, потом, через отбивку, правые колонки. Иначе
  // чекбоксы перечисляют то же самое в третьем порядке, и глазами их каждый
  // раз приходится искать заново.
  const TOGGLE_CHECKS = [
    { key: 'showPrompt', label: 'prompt', side: 'left' },
    { key: 'showAnswer', label: 'answer', side: 'left' },
    { key: 'showPaths', label: 'paths', side: 'left' },
    { key: 'showHotkey', label: 'hotkeys', side: 'right' },
    { key: 'showEvent', label: 'events', side: 'right' },
    { key: 'showId', label: 'id', side: 'right' },
    { key: 'showCost', label: 'cost', side: 'right' },
    { key: 'showContext', label: 'context', side: 'right' },
  ];
  let toggles = {
    showPrompt: true,
    showAnswer: true,
    showPaths: true,
    showHotkey: true,
    showEvent: true,
    showId: false,
    showCost: true,
    showContext: true,
  };
  let menuOpen = false;
  let menuActions = [];
  let menuActive = 0;
  let menuSessionId = null;
  let infoOpen = false;
  // Показ ждёт первого свежего пакета сессий. Пока ждёт, на экране список
  // прошлого показа — см. beginShow().
  let awaitingSessions = false;
  // Номер показа: сторож «бэкенд молчит» должен гаснуть вместе со своим
  // показом, а не срабатывать в следующий.
  let showToken = 0;

  // Одна таблица «id действия ⇄ клавиша» на всё: подписи в меню Ctrl+K и
  // обработчики прямых клавиш ниже читают именно её. Раньше клавиша была
  // зашита в DIRECT_OPEN_KEYS, а Ctrl+U/Ctrl+I проверялись отдельными
  // литералами рядом — эти две записи могли разъехаться, и меню обещало бы
  // клавишу, которая на деле не работает (или наоборот).
  const ACTION_KEYS = { explorer: 'e', cursor: 'c', terminal: 't', unread: 'u', pr: 'p', info: 'i' };
  const KEY_TO_ACTION = Object.fromEntries(Object.entries(ACTION_KEYS).map(([id, key]) => [key, id]));
  // Эта четвёрка уходит в claude-session-open как есть; unread и info шлют
  // другой invoke и обрабатываются отдельными ветками ниже — но клавишу и
  // подпись в меню все шестеро берут из ACTION_KEYS.
  const DIRECT_OPEN_ACTIONS = ['explorer', 'cursor', 'terminal', 'pr'];

  const search = document.getElementById('search');
  const list = document.getElementById('list');
  const message = document.getElementById('message');
  const statusline = document.getElementById('statusline');
  const sortControl = document.getElementById('sort-control');
  const sortLabel = document.getElementById('sort-label');
  const statusChecks = document.getElementById('status-checks');
  const actionsBackdrop = document.getElementById('actions-backdrop');
  const actionsTitle = document.getElementById('actions-title');
  const actionsList = document.getElementById('actions-list');
  const actionsEmpty = document.getElementById('actions-empty');
  const infoBackdrop = document.getElementById('info-backdrop');
  const infoTitle = document.getElementById('info-title');
  const infoRows = document.getElementById('info-rows');

  function paintSort() {
    sortLabel.textContent = sortMode;
  }

  function invoke(cmd, args) {
    if (!window.__TAURI__) return Promise.resolve();
    return window.__TAURI__.core.invoke(cmd, args);
  }

  const {
    statusDotHtml, ageHtml, stateHtml, sessionIdHtml, sessionName, hotkeyHtml, usageHtml,
    shortPath, titleAttr, escapeHtml, prBadgeHtml,
  } = window.SessionGlyph;

  // Чекбоксы статуслайна и их обработчики — из одной таблицы. Клик по самому
  // чекбоксу не должен всплывать до statusline: там висит смена сортировки.
  const toggleInputs = new Map();
  // Отбивка между половинами — на первом чекбоксе правой группы: отдельный
  // пустой элемент-разделитель пришлось бы ещё и прятать, когда группа пуста.
  statusChecks.innerHTML = TOGGLE_CHECKS.map(({ key, label, side }, i) => {
    const gap = side === 'right' && TOGGLE_CHECKS[i - 1]?.side === 'left' ? ' gap' : '';
    return `<label class="status-check${gap}"><input type="checkbox" data-toggle="${key}"> ${escapeHtml(label)}</label>`;
  }).join('');
  for (const input of statusChecks.querySelectorAll('input[data-toggle]')) {
    const key = input.dataset.toggle;
    toggleInputs.set(key, input);
    input.addEventListener('click', (e) => {
      e.stopPropagation();
    });
    input.addEventListener('change', () => {
      toggles[key] = input.checked;
      render();
      invoke('picker_send', {
        action: 'windows/claude-sessions-toggle',
        payload: { key, value: input.checked },
      });
    });
  }

  function paintToggles() {
    for (const [key, input] of toggleInputs) input.checked = !!toggles[key];
  }

  // Что сейчас нарисовано: ключи в порядке DOM и разметка каждого элемента.
  // Решение, что из этого менять, считает planListSync (picker-list-sync.js);
  // здесь остаётся только запись в DOM.
  let rendered = { keys: [], html: [] };

  function syncList(items) {
    const plan = window.PickerListSync.planListSync(rendered, items, list.children.length);
    if (plan.mode === 'rebuild') {
      list.innerHTML = plan.html.join('');
    } else {
      // Снимок детей до правок: outerHTML заменяет элемент, а живая коллекция
      // list.children отдала бы уже новый узел на следующей итерации.
      const nodes = Array.from(list.children);
      for (const update of plan.updates) nodes[update.index].outerHTML = update.html;
    }
    rendered = { keys: plan.keys, html: plan.html };
  }

  function render() {
    const nowSec = Math.floor(Date.now() / 1000);
    rows = [];
    const items = [];

    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) {
      for (const snap of snapshotRows) {
        const index = rows.length;
        rows.push(snap);
        items.push({
          key: `snap:${snap.id || index}`,
          html: `<div class="row" data-index="${index}">` +
            `<div class="text">` +
            `<div class="name">${escapeHtml(snap.line1)}</div>` +
            `<div class="snap-meta">${escapeHtml(snap.line2)}</div>` +
            `<div class="snap-restore">${escapeHtml(snap.line3)}</div>` +
            `</div></div>`,
        });
      }
      syncList(items);
      if (!rows.length) {
        message.style.display = 'block';
        message.textContent = snapshotsLoading ? 'Loading snapshots…' : 'No snapshots yet.';
      } else {
        message.style.display = 'none';
      }
      if (active >= rows.length) active = Math.max(0, rows.length - 1);
      paint();
      return;
    }

    const visible = window.PickerFilter.filterSessions(groups, search.value);
    // Одна отметка времени на всю отрисовку: иначе строки одного и того же
    // списка считали бы возраст от чуть разных «сейчас».
    for (const group of visible) {
      items.push({
        key: `g:${group.label}`,
        html: `<div class="group-label">${escapeHtml(group.label)}</div>`,
      });
      for (const session of group.sessions) {
        const index = rows.length;
        rows.push(session);
        const html = `<div class="row ${session.open ? '' : 'closed'}${session.agentState ? ' markable' : ''}" data-index="${index}"${titleAttr(session)}>` +
          statusDotHtml(session) +
          `<div class="text"><div class="name">${escapeHtml(session.label)}` +
          `${prBadgeHtml(session)}` +
          `</div>` +
          (toggles.showPaths
            ? `<div class="cwd">${escapeHtml(shortPath(session.cwd))}</div>` : '') +
          // Две строки под карточкой: что спросили и чем ответили. Пустой div
          // всё равно занял бы высоту, поэтому рисуем только то, что есть.
          // Склейку «сводка, а у работающей — последняя» считает windows11-manager
          // (`agentDescription`): та же строка уходит в Home Assistant и на плату.
          (toggles.showPrompt && session.agentPrompt
            ? `<div class="prompt">${escapeHtml(session.agentPrompt)}</div>` : '') +
          (toggles.showAnswer && session.agentDescription
            ? `<div class="summary">${escapeHtml(session.agentDescription)}</div>` : '') +
          `</div>` +
          // Правые колонки — одной группой: она и прижимает их вправо. Порознь
          // это делала `.state` своим margin-left: auto, и стоило снять с неё
          // чекбокс, как всё съезжало к названию сессии.
          `<div class="meta">` +
          stateHtml(session, toggles.showEvent) +
          sessionIdHtml(session, toggles.showId) +
          hotkeyHtml(session, toggles.showHotkey) +
          usageHtml(session, toggles) +
          ageHtml(session, nowSec) +
          `</div></div>`;
        items.push({ key: `s:${session.id}`, html });
      }
    }
    syncList(items);
    message.style.display = rows.length ? 'none' : 'block';
    if (!rows.length) message.textContent = groups.length ? 'Nothing matches.' : 'No claude sessions yet.';
    if (active >= rows.length) active = Math.max(0, rows.length - 1);
    paint();
  }

  function paint() {
    const nodes = list.querySelectorAll('.row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === active));
  }

  function move(delta) {
    if (!rows.length) return;
    active = (active + delta + rows.length) % rows.length;
    paint();
    // Только здесь, не в paint: render() тикает раз в секунду с обновлением
    // списка, и scrollIntoView каждый раз дёргал бы скролл к активной строке,
    // даже когда пользователь сам ушёл вниз читать другие сессии.
    const current = list.querySelectorAll('.row')[active];
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  async function choose() {
    const row = rows[active];
    if (!row) return;
    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) {
      await invoke('hide_picker');
      await invoke('picker_send', {
        action: 'windows/claude-snapshot-restore',
        payload: { id: row.id },
      });
      return;
    }
    await invoke('hide_picker');
    // Always go through claude-focus rather than picking the action here from
    // this ~1s-stale snapshot. claudeFocus() re-fetches live session state and
    // runs it through chooseAction() (src/picker/session-groups.js), which is
    // the single place that decides focus-vs-restore against the current
    // handle. Deciding it here too would leave two decision points that must
    // agree — and this one, working off a stale snapshot, previously routed a
    // session that had actually opened since the last snapshot into
    // claude-restore-one, which correctly refused to double-spawn it but then
    // reported a bogus "failed to restore" instead of focusing the live window.
    await invoke('picker_send', {
      action: 'windows/claude-focus',
      payload: { id: row.id },
    });
  }

  function requestSnapshots() {
    snapshotsLoading = true;
    snapshotRows = [];
    render();
    invoke('picker_send', { action: 'windows/claude-snapshots' });
  }

  function onSearchInput() {
    active = 0;
    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) {
      requestSnapshots();
      return;
    }
    snapshotRows = [];
    snapshotsLoading = false;
    render();
  }

  function closeMenu() {
    menuOpen = false;
    menuActions = [];
    menuActive = 0;
    menuSessionId = null;
    actionsBackdrop.classList.remove('open');
    actionsBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  function closeInfo() {
    infoOpen = false;
    infoBackdrop.classList.remove('open');
    infoBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  function openInfo(session) {
    if (!session) return;
    const nowSec = Math.floor(Date.now() / 1000);
    // Не label: в нём у сессий-двойников висит хвост «(abcd)», а полный id
    // и так стоит первой строкой таблицы — см. sessionName.
    infoTitle.textContent = `${sessionName(session)} — ${shortPath(session.cwd || '')}`;
    infoRows.innerHTML = window.SessionInfo.buildSessionInfoRows(session, nowSec)
      .map(row => `<div class="info-row"><span class="k">${escapeHtml(row.label)}</span>`
        + `<span class="v">${escapeHtml(row.value)}</span></div>`)
      .join('');
    infoOpen = true;
    infoBackdrop.classList.add('open');
    infoBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  function paintMenu() {
    const nodes = actionsList.querySelectorAll('.action-row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === menuActive));
  }

  function renderMenu(data) {
    menuSessionId = data.id;
    menuActions = data.actions || [];
    menuActive = 0;
    const name = data.label ? sessionName(data) : '';
    const title = name
      ? `${name} — ${shortPath(data.cwd || '')}`
      : shortPath(data.cwd || '') || 'Session';
    actionsTitle.textContent = title;
    if (!menuActions.length) {
      actionsList.innerHTML = '';
      actionsEmpty.style.display = 'block';
    } else {
      actionsEmpty.style.display = 'none';
      // Клавиша справа — из ACTION_KEYS (единая таблица, см. её объявление
      // выше): нет записи для id — ничего не рисуем, пустой элемент не нужен.
      actionsList.innerHTML = menuActions.map((action, index) => {
        const key = ACTION_KEYS[action.id];
        const hotkey = key ? `<span class="action-hotkey">^${escapeHtml(key.toUpperCase())}</span>` : '';
        return `<div class="action-row${index === 0 ? ' active' : ''}" data-index="${index}" role="menuitem">` +
          `<span class="action-label">${escapeHtml(action.label)}</span>${hotkey}</div>`;
      }).join('');
    }
    menuOpen = true;
    actionsBackdrop.classList.add('open');
    actionsBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  function openMenu() {
    if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
    const session = rows[active];
    if (!session) return;
    menuSessionId = session.id;
    invoke('picker_send', {
      action: 'windows/claude-session-actions',
      payload: { id: session.id },
    });
  }

  async function runMenuAction() {
    const action = menuActions[menuActive];
    if (!action || !menuSessionId) return;
    const id = menuSessionId;
    const actionId = action.id;
    closeMenu();
    // Пометка непрочитанным — единственное действие, после которого смотреть
    // надо на этот же список: кружок перекрашивается в ближайшую секунду, и
    // сессий за раз помечают несколько.
    if (actionId === 'unread') {
      await invoke('picker_send', {
        action: 'windows/claude-session-unread',
        payload: { id },
      });
      return;
    }
    if (actionId === 'info') {
      // По id, а не по индексу active: список перерисовывается раз в секунду,
      // пока меню открыто, render() пересобирает rows в порядке текущей
      // сортировки, и active остаётся числом — строка под этим индексом может
      // смениться на другую сессию. Ctrl+I из списка (обработчик ниже) этой
      // ловушке не подвержен: там меню не открыто, и active — это и есть
      // выбранная строка.
      openInfo(rows.find(r => r.id === id));
      return;
    }
    await invoke('hide_picker');
    await invoke('picker_send', {
      action: 'windows/claude-session-open',
      payload: { id, action: actionId },
    });
  }

  function moveMenu(delta) {
    if (!menuActions.length) return;
    menuActive = (menuActive + delta + menuActions.length) % menuActions.length;
    paintMenu();
  }

  search.addEventListener('input', onSearchInput);

  // Подсказка «что сделает Shift+клик» держится отдельно от основного
  // обработчика keydown ниже: у того есть ранние выходы для открытых
  // оверлеев (menuOpen/infoOpen), а подсветка от режима оверлея не зависит —
  // Shift остаётся Shift'ом независимо от того, что сейчас открыто.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Shift') document.body.classList.add('shift');
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') document.body.classList.remove('shift');
  });
  // Alt+Tab с зажатым Shift уводит фокус из окна без keyup: без этого класс
  // остался бы висеть до следующего нажатия Shift после возврата.
  window.addEventListener('blur', () => {
    document.body.classList.remove('shift');
  });

  // Прямые клавиши дублируют четыре пункта меню Ctrl+K (PR, терминал,
  // Explorer, Cursor) без открытия самого меню — буква ведёт прямо к id
  // действия, который уходит в windows/claude-session-open как есть.
  // Применимость действия (есть ли PR у сессии, запущен ли Cursor,
  // переводится ли путь на диск Windows) проверяет сервер и сам сообщает
  // человеку через уведомление, если действие невозможно — здесь это не
  // дублируется.

  document.addEventListener('keydown', (e) => {
    if (infoOpen) {
      if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeInfo(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    if (menuOpen) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveMenu(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveMenu(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runMenuAction(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      openMenu();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === ACTION_KEYS.info) {
      e.preventDefault();
      if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      openInfo(rows[active]);
      return;
    }
    // Ctrl+P/T/E/C — прямые клавиши на открытие PR/терминала/Explorer/Cursor,
    // preventDefault здесь обязателен: иначе Ctrl+P в webview уйдёт в печать.
    // Ctrl+C из этой таблицы означает то же самое: до правки это было
    // копирование выделенного текста в поле поиска, после — открытие Cursor.
    // Человек попросил именно Ctrl+C для Cursor, зная про этот размен;
    // недосмотра тут нет.
    if (e.ctrlKey || e.metaKey) {
      const directActionId = KEY_TO_ACTION[e.key.toLowerCase()];
      if (directActionId && DIRECT_OPEN_ACTIONS.includes(directActionId)) {
        e.preventDefault();
        if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
        const session = rows[active];
        if (!session) return;
        invoke('hide_picker');
        invoke('picker_send', {
          action: 'windows/claude-session-open',
          payload: { id: session.id, action: directActionId },
        });
        return;
      }
    }
    // Ctrl+U — пометить непрочитанным, как пункт unread в меню Ctrl+K: в
    // отличие от четвёрки выше пикер после него не закрывается.
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === ACTION_KEYS.unread) {
      e.preventDefault();
      if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      const session = rows[active];
      if (!session) return;
      invoke('picker_send', {
        action: 'windows/claude-session-unread',
        payload: { id: session.id },
      });
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(); }
    else if (e.key === 'Escape') { e.preventDefault(); invoke('hide_picker'); }
  });

  list.addEventListener('click', (e) => {
    if (menuOpen) return;
    const row = e.target.closest('.row');
    if (!row) return;
    active = Number(row.dataset.index);
    // Shift+клик помечает непрочитанным вместо открытия. Промах по Shift не
    // должен превращаться в открытие сессии, поэтому строка без записи агента
    // (снимки, сессия без хука) просто ничего не делает.
    if (e.shiftKey) {
      if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      const session = rows[active];
      if (!session || !session.agentState) return;
      invoke('picker_send', {
        action: 'windows/claude-session-unread',
        payload: { id: session.id },
      });
      return;
    }
    choose();
  });

  actionsList.addEventListener('click', (e) => {
    const row = e.target.closest('.action-row');
    if (!row) return;
    menuActive = Number(row.dataset.index);
    runMenuAction();
  });

  actionsBackdrop.addEventListener('click', (e) => {
    if (e.target === actionsBackdrop) closeMenu();
  });

  infoBackdrop.addEventListener('click', (e) => {
    if (e.target === infoBackdrop) closeInfo();
  });

  sortControl.addEventListener('click', (e) => {
    e.preventDefault();
    if (menuOpen) return;
    invoke('picker_send', { action: 'windows/claude-sessions-sort-cycle' });
  });

  // Reset the palette for a show and (re)start the feed. Called both from the
  // 'picker-shown' listener (every show after the window has finished
  // loading) and, once, directly from start() to cover the show that raced
  // ahead of this webview finishing DOMContentLoaded (see start()).
  function beginShow() {
    closeMenu();
    closeInfo();
    search.value = '';
    active = 0;
    snapshotRows = [];
    snapshotsLoading = false;
    // Показ начинается с чистого состояния: Shift, зажатый перед вызовом
    // пикера (или отпущенный, пока окно было скрыто и события до него не
    // доходили), не должен продолжать рисовать подсказку в новом сеансе.
    document.body.classList.remove('shift');
    search.focus();
    search.select();
    // Список предыдущего показа остаётся на экране до первого свежего пакета.
    // Здесь стояло `groups = []` — окно открывалось пустым, с «Loading…», и
    // настоящий список дорисовывался только через ~300 мс (столько стоит
    // claudeWtSessions() на сетевом диске). Этот пустой кадр и мелькал при
    // каждом открытии. Строки в нём те же самые, а выбор всё равно уходит по
    // id через claude-focus, который перечитывает живое состояние (см.
    // choose()), — то есть устаревший кадр никуда не уводит по ошибке.
    //
    // Свою отрисовку показ всё же делает: search.value только что очищен, и
    // фильтр предыдущего показа надо снять. Строки при этом на месте, syncList
    // трогает только те, что изменились.
    awaitingSessions = true;
    showToken += 1;
    const token = showToken;
    render();
    // Первый показ за загрузку страницы: рисовать нечего, и «Loading…» стоит
    // вместо пустоты. Дальше сюда не попадаем — список уже есть.
    if (!rows.length) message.textContent = 'Loading…';
    invoke('picker_send', { action: 'windows/claude-sessions-start' });
    setTimeout(() => {
      // Сторож своего показа, а не вообще: за две секунды пикер могли закрыть
      // и открыть заново, и тогда молчание относится к прошлому показу.
      // Строки к этому моменту заведомо устарели — снимаем их вместе с
      // сообщением, иначе «не отвечает» осталось бы невидимым под списком.
      if (token !== showToken || !awaitingSessions) return;
      groups = [];
      render();
      message.style.display = 'block';
      message.textContent = 'Backend not responding.';
    }, 2000);
  }

  async function start() {
    if (!window.__TAURI__) { message.textContent = 'No backend detected.'; return; }
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    await listen('claude-wt-sessions', (event) => {
      const data = event.payload || {};
      // Бэкенд ответил — сторож показа больше не нужен, даже если ответ
      // ошибочный или пришёл в режиме снимков: там своё сообщение, и затирать
      // его через две секунды словами «не отвечает» неверно.
      awaitingSessions = false;
      if (window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      if (!data.ok) {
        groups = [];
        render();
        message.style.display = 'block';
        message.textContent = data.reason || 'claude-wt is not available.';
        return;
      }
      groups = data.groups || [];
      if (data.sort) sortMode = data.sort;
      // Состояние чекбоксов — из конфига, а не из того, что помнит страница:
      // пикер живёт между показами, а config.yml могли поправить руками.
      for (const { key } of TOGGLE_CHECKS) {
        if (typeof data[key] === 'boolean') toggles[key] = data[key];
      }
      paintSort();
      paintToggles();
      render();
    });

    await listen('claude-wt-snapshots', (event) => {
      const data = event.payload || {};
      snapshotsLoading = false;
      if (!window.PickerSnapshots.isSnapshotsCommand(search.value)) return;
      if (!data.ok) {
        snapshotRows = [];
        render();
        message.style.display = 'block';
        message.textContent = data.reason || 'claude-wt snapshots failed.';
        return;
      }
      snapshotRows = window.PickerSnapshots.buildSnapshotRows(
        data.snapshots || [],
        new Set(data.openSessionIds || []),
      );
      render();
    });

    await listen('claude-wt-session-actions', (event) => {
      const data = event.payload || {};
      if (!data.ok) {
        if (menuSessionId) {
          renderMenu({ id: menuSessionId, label: '', cwd: '', actions: [] });
        }
        return;
      }
      if (menuSessionId && data.id !== menuSessionId) return;
      renderMenu(data);
    });

    // Fired by Rust every time the window is shown.
    await listen('picker-shown', beginShow);

    await listen('picker-hidden', () => {
      closeMenu();
      closeInfo();
      invoke('picker_send', { action: 'windows/claude-sessions-stop' });
    });

    search.focus();

    // The hotkey is live from Rust's setup(), before this webview has
    // necessarily finished loading — a press in that window shows the
    // picker without a 'picker-shown' event ever reaching a listener that
    // didn't exist yet. Cover that first-show race by checking whether the
    // window is already visible right now; if so, this is that race and the
    // feed needs to be started here instead of waiting for an event that
    // already fired.
    const alreadyVisible = await getCurrentWindow().isVisible().catch(() => false);
    if (alreadyVisible) {
      beginShow();
    }
  }

  window.addEventListener('DOMContentLoaded', () => { start(); });
</script>
</body>
</html>

[package]
name = "pro-popstas-windows-mqtt"
version = "1.1.0"
authors = ["Stanislav Popov"]
edition = "2021"
license = "MIT"
repository = "https://github.com/popstas/windows-mqtt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time"] }
rumqttc = "0.24"
serde_json = "1"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Профиль под выкатку, а не под витрину: время сборки здесь — время, которое
# человек ждёт. Стояли `lto = true` и `codegen-units = 1`, то есть fat-LTO по
# дереву из полутысячи зависимостей в один поток на каждую пересборку.
#
# Замерено на соседях с тем же деревом Tauri 2 (16-поточная Windows-машина и
# MacBook Air): fat-LTO — 208 с, без него — 70 с, с `incremental` — 37 с;
# у windows11-manager, где LTO и не было, `incremental` дал 78,7 → 13,8 с.
# Здесь замер не воспроизвести, пока проект не собирается на той машине, но
# рычаг тот же и дерево то же.
#
# Оптимизации всей программы приложение не окупает: оно ждёт сообщений MQTT.
# Мегабайт бинаря платят один раз, минуты — каждую сборку.
[profile.release]
lto = false
codegen-units = 16
incremental = true

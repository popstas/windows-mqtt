[package]
name = "pro-popstas-windows-mqtt"
version = "1.1.0"
authors = ["Stanislav Popov"]
edition = "2021"
license = "MIT"
repository = "https://github.com/popstas/windows-mqtt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time"] }
rumqttc = "0.24"
serde_json = "1"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Профиль под выкатку, а не под витрину: время сборки здесь — время, которое
# человек ждёт. Стояли `lto = true` и `codegen-units = 1`, то есть fat-LTO по
# дереву из полутысячи зависимостей в один поток на каждую пересборку.
#
# Замерено на целевой Windows-машине (i5-12600K, 16 потоков), пересборка после
# правки одной строки в `main.rs`, `cargo build` без бандла:
#
#   lto = true,  codegen-units = 1                   204,4 с / 205,6 с
#   нынешний профиль                            3,6 / 3,7 / 3,8 / 3,9 с
#
# Пятидесятикратно — больше, чем у соседей (у пикера 208 → 37 с, у
# windows11-manager 78,7 → 13,8 с), и причина в том, что крейт здесь крошечный:
# Rust тут только оболочка, работу делает node. Компилировать после правки почти
# нечего, а fat-LTO по дереву из полутысячи зависимостей стоил свои три минуты
# независимо от того, что изменилось.
#
# Оговорка к замеру: первая пересборка сразу после полной обходится дороже
# (13,6 с против 3,8 с) — инкрементального кеша у изменившегося юнита ещё нет.
# Меряя один прогон, легко записать это число как настоящее.
#
# Оптимизации всей программы приложение не окупает: оно ждёт сообщений MQTT.
# Мегабайт бинаря платят один раз, минуты — каждую сборку.
[profile.release]
lto = false
codegen-units = 16
incremental = true
